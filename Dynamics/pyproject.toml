[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-base-dynamics"
version = "0.1.0"
description = "Wave activity flux, Rossby wave source, spherical winds and meridional mass streamfunction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RH_Deng"}, {name = "Codex (OpenAI, AI-assisted organization and refactoring)"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
spectral = ["windspharm>=2.0.0"]
test = ["pytest>=7"]

[project.scripts]
climate-dynamics = "climate_dynamics.__main__:main"

[tool.setuptools.packages.find]
include = ["climate_dynamics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
