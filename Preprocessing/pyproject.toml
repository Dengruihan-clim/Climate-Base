[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-preprocessing"
dynamic = ["version"]
description = "Strict, lazy climate preprocessing with xarray and Dask"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RH_Deng"}, {name = "Codex (OpenAI, AI-assisted organization and refactoring)"}]
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.6",
    "dask[array]>=2024.5",
    "netCDF4>=1.6",
    "cftime>=1.6",
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.15.1,<0.10", "eccodes>=2.50,<3"]
zarr = ["zarr>=2.18.7,<3", "numcodecs>=0.15.1,<0.16"]
regrid = ["xesmf>=0.9.2,<0.10"]
vertical = ["metpy>=1.7.1,<1.8"]
test = ["pytest>=7"]
dev = ["pytest>=7", "build>=1.2", "ruff>=0.9", "pre-commit>=3"]

[project.urls]
Repository = "https://github.com/Dengruihan-clim/Climate-Base"
Documentation = "https://github.com/Dengruihan-clim/Climate-Base/tree/main/Preprocessing"

[project.scripts]
climate-preprocessing = "climate_preprocessing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["climate_preprocessing*"]

[tool.setuptools.dynamic]
version = {attr = "climate_preprocessing._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "zarr: requires the optional real local Zarr v2 backend",
    "grib: requires the optional real cfgrib/ecCodes backend",
    "regrid: requires the optional real xESMF/ESMPy/ESMF backend",
    "vertical: requires the optional real MetPy interpolation backend",
    "geocat: optional comparison against actual GeoCAT-comp public APIs",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
