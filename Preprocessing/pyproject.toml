[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-preprocessing"
version = "0.1.0"
description = "Strict monthly CF reading and calendar-aware complete-season preprocessing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RH_Deng"}, {name = "Codex (OpenAI, AI-assisted organization and refactoring)"}]
dependencies = ["numpy>=1.24", "netCDF4>=1.6", "cftime>=1.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
climate-preprocessing = "climate_preprocessing.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["climate_preprocessing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
