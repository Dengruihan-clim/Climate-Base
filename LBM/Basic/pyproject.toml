[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reanalysis-lbm-background"
version = "0.1.0"
description = "Configurable monthly reanalysis to T42L20 dry LBM basic states"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RH_Deng"}, {name = "Codex (OpenAI, AI-assisted refactoring)"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "netCDF4>=1.6"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
lbm-background = "lbm_background.__main__:main"

[tool.setuptools.packages.find]
include = ["lbm_background*"]
